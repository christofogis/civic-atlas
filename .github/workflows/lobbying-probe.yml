name: Probe LDA.gov API (developer tool)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ingest/lobbying-probe.mjs
        env:
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
