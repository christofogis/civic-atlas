name: Alert on failure

# When a data job or the site check fails, open a GitHub issue (GitHub emails the repo owner),
# or comment on the open one for that workflow so repeated failures don't pile up.
on:
  workflow_run:
    workflows:
      - Ingest members and committees
      - Ingest votes
      - Ingest bills
      - Ingest stock trades
      - Ingest lobbying reports
      - Ingest FEC totals
      - Ingest FEC detail
      - Ingest schedule
      - Site check
    types: [completed]

permissions:
  issues: write

jobs:
  alert:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          title="Failed: $NAME"
          body="The run failed: $URL"
          existing=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$REPO" --body "Failed again: $URL"
          else
            gh issue create -R "$REPO" --title "$title" --body "$body"
          fi
