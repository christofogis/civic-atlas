name: Ingest FEC totals

on:
  schedule:
    - cron: "41 2 * * 3"    # weekly, Tuesday evenings Pacific (away from the bills runs; same API key)
  workflow_dispatch:
    inputs:
      only_candidates:
        description: "Skip the totals; refresh the candidate list only"
        type: boolean
        default: false
      dry_run:
        description: "Fetch two candidates only; write nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ingest-fec
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: https://fkbzxaoeyrtzviyfzulq.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: FEC totals
        if: ${{ !inputs.only_candidates }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then node scripts/ingest/fec.mjs --dry-run --limit 2
          else node scripts/ingest/fec.mjs; fi
      - name: Candidates for the next election
        if: ${{ !cancelled() }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then node scripts/ingest/fec-candidates.mjs --dry-run
          else node scripts/ingest/fec-candidates.mjs; fi
