name: Probe earmark tables (developer tool)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null && pip install -q openpyxl
      - run: scripts/dev/earmark-probe.sh
