name: Site check

# Nightly: open key pages of the live site in a real browser and check their content and
# accessibility.
on:
  schedule:
    - cron: "11 15 * * *"   # daily, 7:11am Pacific, after the morning data jobs
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site URL"
        type: string
        default: "https://civic-atlas-cub.pages.dev"
      a11y_report:
        description: "Accessibility: list every finding without failing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/checks/site.mjs "${{ inputs.base_url || 'https://civic-atlas-cub.pages.dev' }}"
      - name: Accessibility (axe, WCAG 2.2 AA; key pages in dark mode too)
        if: always()
        run: node scripts/checks/a11y.mjs "${{ inputs.base_url || 'https://civic-atlas-cub.pages.dev' }}" ${{ inputs.a11y_report && '--report' || '' }}
      - name: Address lookups (federal and state officials)
        if: always()
        env:
          LOOKUP_CHECK_TOKEN: ${{ secrets.LOOKUP_CHECK_TOKEN }}
        run: node scripts/checks/lookup.mjs "${{ inputs.base_url || 'https://civic-atlas-cub.pages.dev' }}"
      - name: Human check enforced? (reports only)
        if: always()
        env:
          SITE_URL: ${{ inputs.base_url || 'https://civic-atlas-cub.pages.dev' }}
        run: node scripts/checks/turnstile.mjs
      - name: Congress transition rehearsal (next Jan 3)
        if: always()
        env:
          LOOKUP_CHECK_TOKEN: ${{ secrets.LOOKUP_CHECK_TOKEN }}
        run: node scripts/checks/transition.mjs "${{ inputs.base_url || 'https://civic-atlas-cub.pages.dev' }}"
