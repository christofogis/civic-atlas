name: Site check

# Nightly: open key pages of the live site in a real browser and check their content.
on:
  schedule:
    - cron: "11 15 * * *"   # daily, 7:11am Pacific, after the morning data jobs
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site URL"
        type: string
        default: "https://civic-atlas-cub.pages.dev"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/checks/site.mjs "${{ inputs.base_url || 'https://civic-atlas-cub.pages.dev' }}"
