name: Smoke test

# Manual check of the live lookup API with public addresses (government buildings only).
# With Turnstile enforced, the expected result is HTTP 403 for every lookup: a script
# cannot pass the bot check. A 200 here means the check is off.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site URL"
        type: string
        default: "https://civic-atlas-cub.pages.dev"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lookups
        env:
          BASE: ${{ inputs.base_url }}
        run: |
          for a in "200 N Spring St, Los Angeles, CA 90012" "200 W 24th St, Cheyenne, WY 82002" \
                   "1600 Pennsylvania Ave NW, Washington, DC 20500" "90210"; do
            echo "=== $a"
            curl -sS -w "\nHTTP %{http_code}\n" --get --data-urlencode "address=$a" "$BASE/api/lookup" | head -c 3000
            echo
          done
