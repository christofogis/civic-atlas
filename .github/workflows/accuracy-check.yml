name: Accuracy check

# Weekly: compare random facts on the site with the original sources; results are public.
# Also checks the database size against the free plan's 500 MB limit.
on:
  schedule:
    - cron: "17 17 * * 1"   # Mondays, 9:17am Pacific
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://fkbzxaoeyrtzviyfzulq.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/checks/accuracy.mjs
      - name: Database size
        if: always()
        run: node scripts/checks/db-size.mjs
      - name: Supreme Court justices still current
        if: always()
        run: node scripts/checks/justices.mjs
      - name: Congressional leaders still current
        if: always()
        run: node scripts/checks/leadership.mjs
      - name: Orange County officials still current
        if: always()
        run: node scripts/checks/local.mjs
      - name: California statewide officials still current
        if: always()
        run: node scripts/checks/statewide.mjs
