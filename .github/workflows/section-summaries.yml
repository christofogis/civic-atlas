name: Bill section summaries (AI)

# Plain-language summaries of each bill section, written by Claude through Anthropic's Batch API.
# Daily after the bills job: new summaries for bills that moved (passed a chamber or became law),
# newest Congress first, a limited number of bills per run; each is checked before it is published.
on:
  schedule:
    - cron: "41 15 * * *"   # 7:41am PT, after the morning bills run
  workflow_dispatch:
    inputs:
      bills:
        description: "Bills to summarize, e.g. 119-hr-1,119-s-2 (blank: bills that moved, newest first)"
        type: string
        default: ""
      limit:
        description: "Bills per run when no list is given"
        type: string
        default: "50"
      wait:
        description: "Minutes to wait for the batch before leaving it for the next run"
        type: string
        default: "90"
      redo:
        description: "Summarize again and replace existing summaries (after the instructions change)"
        type: boolean
        default: false
      dry_run:
        description: "Build the requests and print one; send nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: section-summaries
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_URL: https://fkbzxaoeyrtzviyfzulq.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Summarize
        env:
          BILLS: ${{ inputs.bills }}
          LIMIT: ${{ inputs.limit || '120' }}
          WAIT: ${{ inputs.wait || '120' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          REDO: ${{ inputs.redo && '--redo' || '' }}
        run: |
          if [ -n "$BILLS" ]; then node scripts/ingest/section-summaries.mjs --bills "$BILLS" --wait "$WAIT" $DRY_RUN $REDO
          else node scripts/ingest/section-summaries.mjs --limit "$LIMIT" --wait "$WAIT" $DRY_RUN $REDO; fi
