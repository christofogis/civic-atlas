name: Fetch PTR samples

# Developer tool: downloads a handful of real STOCK Act filings (House index + PDFs, Senate
# eFD pages) as a workflow artifact, so parsers can be built against actual documents.
#
# Senate eFD shows a public-use agreement (5 U.S.C. § 13107: no commercial use other than news
# media dissemination to the public; no use for credit ratings or soliciting money). The project
# owner (Chris) reviewed these terms and authorized automated acceptance on Nov 23, 2026, for
# Civic Atlas's free, non-commercial public use.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: House index and sample PTR PDFs
        run: |
          mkdir -p out/house && cd out/house
          curl -sSfL -o 2026FD.zip https://disclosures-clerk.house.gov/public_disc/financial-pdfs/2026FD.zip
          unzip -o -q 2026FD.zip && ls -la
          # Most recent 8 PTRs (FilingType P) by DocID
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, urllib.request
          root = ET.parse("2026FD.xml").getroot()
          rows = [{c.tag: (c.text or "") for c in m} for m in root]
          ptr = [r for r in rows if r.get("FilingType") == "P"]
          print("filings:", len(rows), "PTRs:", len(ptr))
          print("fields:", list(rows[0].keys()))
          ptr.sort(key=lambda r: r.get("FilingDate", ""), reverse=True)
          for r in ptr[:8]:
              url = f"https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/{r['DocID']}.pdf"
              try:
                  urllib.request.urlretrieve(url, f"{r['DocID']}.pdf"); print("ok", r)
              except Exception as e:
                  print("fail", url, e)
          EOF
      - name: Senate eFD sample PTR pages
        run: |
          mkdir -p out/senate && cd out/senate
          python3 - <<'EOF'
          import http.cookiejar, urllib.request, urllib.parse, re, json
          jar = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          op.addheaders = [("User-Agent", "civic-atlas (github.com/christofogis/civic-atlas)")]
          base = "https://efdsearch.senate.gov"
          home = op.open(base + "/search/home/").read().decode()
          open("home.html", "w").write(home)
          tok = re.search(r'name="csrfmiddlewaretoken" value="([^"]+)"', home).group(1)
          data = urllib.parse.urlencode({"prohibition_agreement": "1", "csrfmiddlewaretoken": tok}).encode()
          req = urllib.request.Request(base + "/search/home/", data=data, headers={"Referer": base + "/search/home/"})
          op.open(req).read()
          csrf = next(c.value for c in jar if c.name == "csrftoken")
          form = {"start": "0", "length": "8", "report_types": "[11]", "filer_types": "[]",
                  "submitted_start_date": "10/01/2026 00:00:00", "submitted_end_date": "",
                  "candidate_state": "", "senator_state": "", "office_id": "", "first_name": "", "last_name": "",
                  "csrfmiddlewaretoken": csrf}
          req = urllib.request.Request(base + "/search/report/data/", data=urllib.parse.urlencode(form).encode(),
                                       headers={"Referer": base + "/search/", "X-CSRFToken": csrf})
          res = json.loads(op.open(req).read())
          json.dump(res, open("search.json", "w"), indent=1)
          print("records:", res.get("recordsFiltered"))
          for i, row in enumerate(res.get("data", [])[:6]):
              m = re.search(r'href="([^"]+)"', row[3])
              if not m: continue
              url = base + m.group(1)
              open(f"report{i}.html", "w").write(op.open(url).read().decode()); print("ok", row[:3], url)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ptr-samples
          path: out/
          retention-days: 3
