name: Lighthouse (phone speed and accessibility)

# By hand: Lighthouse's mobile profile (slow 4G, mid-range phone) on a few pages of the live site.
# Prints the scores and the slowest items; writes nothing.
on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Comma-separated paths"
        default: "/,/member/P000145,/bill/119/hr/1,/budget,/week,/local/ca-orange"
      base_url:
        description: "Site URL (e.g. a branch preview)"
        default: "https://civic-atlas-cub.pages.dev"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lighthouse
        env:
          PATHS: ${{ inputs.paths }}
          BASE_URL: ${{ inputs.base_url }}
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          IFS=',' read -ra P <<< "$PATHS"
          for p in "${P[@]}"; do
            npx -y lighthouse@12 "${BASE_URL:-https://civic-atlas-cub.pages.dev}$p" --quiet --output=json --output-path=lh.json \
              --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless=new --no-sandbox" || { echo "$p: lighthouse failed"; continue; }
            node -e '
              const r = require("./lh.json"); const c = r.categories, a = r.audits;
              const s = (k) => Math.round((c[k]?.score ?? 0) * 100);
              console.log(`\n${process.argv[1]}  perf ${s("performance")}  a11y ${s("accessibility")}  best ${s("best-practices")}  seo ${s("seo")}`);
              for (const k of ["first-contentful-paint","largest-contentful-paint","total-blocking-time","cumulative-layout-shift","speed-index"]) console.log(`  ${a[k].title}: ${a[k].displayValue}`);
              const fails = Object.values(a).filter((x) => x.score !== null && x.score < 0.9 && x.scoreDisplayMode !== "informative" && x.scoreDisplayMode !== "notApplicable").map((x) => `  - ${x.title}${x.displayValue ? ` (${x.displayValue})` : ""}`);
              console.log(fails.slice(0, 12).join("\n"));
              const lcp = a["largest-contentful-paint-element"]?.details?.items?.[0]?.items?.[0]?.node;
              if (lcp) console.log(`  LCP element: ${lcp.snippet}`);
              const phases = a["largest-contentful-paint-element"]?.details?.items?.[1]?.items;
              if (phases) console.log("  LCP phases: " + phases.map((x) => `${x.phase} ${Math.round(x.timing)}ms`).join(", "));
              const reqs = (a["network-requests"]?.details?.items ?? []).filter((x) => x.url.includes("supabase")).map((x) => Math.round(x.networkEndTime)).sort((p, q) => q - p);
              const items = a["network-requests"]?.details?.items ?? [];
              const js = items.filter((x) => x.resourceType === "Script").reduce((n, x) => n + (x.transferSize || 0), 0);
              const font = items.filter((x) => x.resourceType === "Font").reduce((n, x) => n + (x.transferSize || 0), 0);
              const img = items.filter((x) => x.resourceType === "Image").reduce((n, x) => n + (x.transferSize || 0), 0);
              console.log(`  JS transferred: ${Math.round(js / 1024)} KB (${items.filter((x) => x.resourceType === "Script").length} files), fonts ${Math.round(font / 1024)} KB, images ${Math.round(img / 1024)} KB, total ${Math.round(items.reduce((n, x) => n + (x.transferSize || 0), 0) / 1024)} KB`);
              console.log(`  LCP ${Math.round(a["largest-contentful-paint"].numericValue)}ms  CLS ${a["cumulative-layout-shift"].numericValue.toFixed(3)}  TBT ${Math.round(a["total-blocking-time"].numericValue)}ms`);
              if (reqs.length) console.log(`  database requests: ${reqs.length}, last finished at ${reqs[0]}ms`);
            ' "$p"
          done
