name: Ingest members, committees, state officials and executive branch

on:
  schedule:
    - cron: "17 12 * * *"   # daily, 4:17am Pacific (UTC cron)
    # Jan 3-6 (a new Congress in odd years): hourly, so new members' terms appear soon after
    # unitedstates/congress-legislators adds them, and seats don't sit at "updating" for a day.
    - cron: "47 * 3-6 1 *"
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: read

concurrency:
  group: ingest-legislators
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://fkbzxaoeyrtzviyfzulq.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}   # read-only: checks when the committee file last changed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Members and terms
        run: node scripts/ingest/members.mjs
      - name: Committees and assignments
        run: node scripts/ingest/committees.mjs
      - name: State legislators and statewide officials (openstates/people, public domain)
        run: |
          git clone -q --depth 1 https://github.com/openstates/people.git /tmp/osp
          OPENSTATES_DIR=/tmp/osp node scripts/ingest/state-people.mjs
      - name: President, vice president and executive orders
        run: node scripts/ingest/executive.mjs
