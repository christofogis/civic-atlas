name: Developer probe

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script under scripts/dev to run"
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node "scripts/dev/${{ inputs.script }}"
