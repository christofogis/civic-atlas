name: Build California BOE district map

# By hand, after a redistricting: the four Board of Equalization districts, simplified for the
# address lookup, from the Citizens Redistricting Commission's final boundaries. Commits
# public/maps/state/ca-boe.json.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build
        run: node scripts/data/ca-boe.mjs
      - name: Commit
        run: |
          git config user.name "civic-atlas bot"
          git config user.email "christofogis@users.noreply.github.com"
          git add public/maps/state/ca-boe.json
          git diff --cached --quiet || (git commit -m "California BOE district map rebuilt from the Redistricting Commission's final maps" && git pull --rebase -q && git push)
