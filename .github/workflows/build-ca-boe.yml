name: Build California BOE district table

# By hand, after a redistricting: which Board of Equalization district each state Senate district
# is in, from the Citizens Redistricting Commission's final boundaries. Commits
# public/data/state/ca-boe-districts.json. Fails if the Senate districts don't nest.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node scripts/data/ca-boe.mjs
      - name: Commit
        run: |
          git config user.name "civic-atlas bot"
          git config user.email "christofogis@users.noreply.github.com"
          git add public/data/state/ca-boe-districts.json
          git diff --cached --quiet || (git commit -m "California BOE district table rebuilt from the Redistricting Commission's final maps" && git pull --rebase -q && git push)
