name: Build local meetings

# Upcoming Orange County Board of Supervisors and Los Alamitos City Council meetings with agenda
# links. Commits public/data/local/meetings.json.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Print what the source pages expose; write nothing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        env:
          PROBE: ${{ inputs.probe }}
        run: |
          if [ "$PROBE" = "true" ]; then
            sudo apt-get install -y -qq poppler-utils >/dev/null
            for u in "https://board.oc.gov/sites/bos.egovoc.com/files/2025-11/2026%20APPROVED%20BOS%20Meeting%20Schedule.pdf" "https://board.oc.gov/sites/bos.egovoc.com/files/2026-11/2027%20Approved%20BOS%20Meeting%20Schedule.pdf"; do
              curl -sfL -A "civic-atlas" -o s.pdf "$u" && pdftoppm -r 110 -png s.pdf s && for f in s*.png; do echo "SHOT-BEGIN $u $f"; base64 -w 4000 "$f" | sed 's/^/SHOT /'; echo "SHOT-END $u $f"; done; rm -f s*.png s.pdf
            done
            exit 0
          fi
          node scripts/data/local-meetings.mjs
      - name: Commit
        if: ${{ !inputs.probe }}
        run: |
          git config user.name "civic-atlas bot"
          git config user.email "christofogis@users.noreply.github.com"
          git add public/data/local/meetings.json
          git diff --cached --quiet || (git commit -m "Local meetings rebuilt from official pages" && git push)
