name: Ingest bills

on:
  schedule:
    - cron: "23 13 * * *"   # daily, 5:23am Pacific: bills changed since the last run
    - cron: "23 1 * * *"   # second daily run, 12 hours later: GitHub can start schedules hours late, and evening votes land sooner
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List and parse a few files only; write nothing"
        type: boolean
        default: false
      full:
        description: "Re-read every bill (first load or repair). Leaves ~50 MB of dead rows: run VACUUM FULL on bills, bill_cosponsors, bill_committees after"
        type: boolean
        default: false
      text_recompute:
        description: "Compare every bill's text versions again (after a method change)"
        type: boolean
        default: false
      text_limit:
        description: "Bills whose text versions to compare this run"
        type: string
        default: "4000"

permissions:
  contents: read

concurrency:
  group: ingest-bills
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: https://fkbzxaoeyrtzviyfzulq.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bills
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FULL: ${{ inputs.full }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then node scripts/ingest/bills.mjs --dry-run --limit 3
          elif [ "$FULL" = "true" ]; then node scripts/ingest/bills.mjs --full
          else node scripts/ingest/bills.mjs; fi
      - name: Compare text versions
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TEXT_LIMIT: ${{ inputs.text_limit || '4000' }}
          RECOMPUTE: ${{ inputs.text_recompute && '--recompute' || '' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then node scripts/ingest/bill-text.mjs --dry-run --limit 3
          else node scripts/ingest/bill-text.mjs --limit "$TEXT_LIMIT" $RECOMPUTE; fi
