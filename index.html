<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Enter your address to see who represents you in Congress, your state and (in Orange County, CA) your county and city, with their records from official sources." />
    <meta property="og:site_name" content="Civic Atlas" />
    <meta property="og:title" content="Civic Atlas: who represents you?" />

         description, canonical URL and preview tags from the Functions in /functions (lib/seoPage.js). -->

    <link rel="preconnect" href="https://fkbzxaoeyrtzviyfzulq.supabase.co" crossorigin />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <meta name="apple-mobile-web-app-title" content="Civic Atlas" />
    <title>Civic Atlas</title>
    <script>
      // Apply a saved Light/Dark choice before the page draws, so it never flashes the wrong theme.
      // No saved choice means System: the stylesheet follows the device setting.
      try { var t = localStorage.getItem("civic-atlas:theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
